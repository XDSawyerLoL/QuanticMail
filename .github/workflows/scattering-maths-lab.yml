name: Scattering mathematical privacy laboratory
on:
  pull_request:
    paths:
      - 'labs/quantic-native/scattering/traffic-privacy-lab.mjs'
      - 'tests/scattering-traffic-privacy-lab.test.mjs'
      - 'docs/QUANTIC-MATH-RADAR-2026.md'
      - '.github/workflows/scattering-maths-lab.yml'
  push:
    branches: ['research/**']
    paths:
      - 'labs/quantic-native/scattering/traffic-privacy-lab.mjs'
      - 'tests/scattering-traffic-privacy-lab.test.mjs'
      - 'docs/QUANTIC-MATH-RADAR-2026.md'
      - '.github/workflows/scattering-maths-lab.yml'

permissions:
  contents: read

jobs:
  research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node runtime
        run: node --version
      - name: Validate syntax and run held-out synthetic leakage tests
        run: |
          node --check labs/quantic-native/scattering/traffic-privacy-lab.mjs
          node --test tests/scattering-traffic-privacy-lab.test.mjs
