name: Windows Alpha native user interface

on:
  push:
    branches: ['feat/**', 'fix/**']
    paths:
      - 'scripts/Quantic-Sillage-Alpha.ps1'
      - 'scripts/Quantic-Sillage-Compose.ps1'
      - 'scripts/Quantic-Sillage-Advanced.ps1'
      - 'scripts/native-windows-compose-draft.mjs'
      - 'scripts/native-windows-compose-send.mjs'
      - 'scripts/native-windows-gui-receive.mjs'
      - 'desktop/native-windows-draft.mjs'
      - 'desktop/native-windows-gui-approval.mjs'
      - 'desktop/native-windows-gui-receive.mjs'
      - 'tests/native-windows-gui-approval.test.mjs'
      - 'tests/native-windows-gui-receive.test.mjs'
      - 'tests/native-windows-draft.test.mjs'
      - 'scripts/Quantic-Sillage-Alpha.nsi'
      - '.github/workflows/windows-alpha-native-ui.yml'
  pull_request:
    paths:
      - 'scripts/Quantic-Sillage-Alpha.ps1'
      - 'scripts/Quantic-Sillage-Compose.ps1'
      - 'scripts/Quantic-Sillage-Advanced.ps1'
      - 'scripts/native-windows-compose-draft.mjs'
      - 'scripts/native-windows-compose-send.mjs'
      - 'scripts/native-windows-gui-receive.mjs'
      - 'desktop/native-windows-draft.mjs'
      - 'desktop/native-windows-gui-approval.mjs'
      - 'desktop/native-windows-gui-receive.mjs'
      - 'tests/native-windows-gui-approval.test.mjs'
      - 'tests/native-windows-gui-receive.test.mjs'
      - 'tests/native-windows-draft.test.mjs'
      - 'scripts/Quantic-Sillage-Alpha.nsi'
      - '.github/workflows/windows-alpha-native-ui.yml'

permissions:
  contents: read

jobs:
  windows-native-winform:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Windows Forms syntax and categorized native actions
        shell: pwsh
        run: |
          foreach($candidate in @('./scripts/Quantic-Sillage-Alpha.ps1','./scripts/Quantic-Sillage-Compose.ps1','./scripts/Quantic-Sillage-Advanced.ps1')) {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $candidate).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ("Invalid PowerShell "+$candidate+": "+($errors -join "; "))}
          }
          $path = (Resolve-Path ./scripts/Quantic-Sillage-Alpha.ps1).Path
          $tok=$null; $errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tok,[ref]$errors)
          if ($errors.Count -gt 0) { throw ("Invalid Windows Alpha UI: "+($errors -join "; ")) }
          $runner = Join-Path $env:SystemRoot "System32/WindowsPowerShell/v1.0/powershell.exe"
          $env:QUANTIC_UI_TEST_CAPTURE='1'
          & $runner -NoProfile -STA -NonInteractive -File $path -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Native Alpha UI modules or field constraints rejected" }
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-Compose.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Native composer self-test failed"}
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-Advanced.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Explicit advanced contract failed"}
          node --test tests/native-windows-draft.test.mjs tests/native-windows-gui-approval.test.mjs tests/native-windows-gui-receive.test.mjs
          if($LASTEXITCODE -ne 0){throw "Draft validation failed"}
          node --check scripts/native-windows-compose-send.mjs
          node --check scripts/native-windows-gui-receive.mjs
          if($LASTEXITCODE -ne 0){throw "GUI receive helper syntax rejected"}
          if($LASTEXITCODE -ne 0){throw "GUI PQ send helper syntax rejected"}
          $helper = Get-Content -LiteralPath ./scripts/native-windows-compose-send.mjs -Raw
          $approval = Get-Content -LiteralPath ./desktop/native-windows-gui-approval.mjs -Raw
          if($helper -notmatch "guiWindowsApproval:true" -or $helper -notmatch "makeGuiDepositApproval" -or $helper -notmatch "lines.next" -or $helper -notmatch "'delivery-unknown'" -or $approval -notmatch "sealed-awaiting-deposit-approval" -or $approval -notmatch "==='SEND'") { throw "GUI send two-step native consent contract missing" }
          $receiveSource = Get-Content -LiteralPath ./scripts/native-windows-gui-receive.mjs -Raw
          if($receiveSource -notmatch "message-awaiting-approval" -or $receiveSource -notmatch "guiWindowsApproval:true" -or $receiveSource -notmatch "receiveWindowsLabFromGUI" -or $receiveSource -notmatch "answer==='OPEN'") { throw "GUI receive consent or native decrypt contract missing" }
          $ui = Get-Content -LiteralPath ./scripts/Quantic-Sillage-Compose.ps1 -Raw
          if($ui -notmatch "Chiffrer et deposer" -or $ui -notmatch "Read-GUIReply" -or $ui -match '(?i)WebBrowser|WebView2|onrender.com') { throw "Native GUI send control missing or remote renderer found" }
          $source = Get-Content -LiteralPath $path -Raw
          if ($source -match "(?i)WebBrowser|WebView2|loadURL|onrender\.com") { throw "Remote renderer reintroduced" }
          if($source -notmatch 'Choose-SyntheticDirectory' -or $source -notmatch 'gui-list-synthetic-identities-lab' -or $source -notmatch 'gui-share-synthetic-contact-card-lab' -or $source -notmatch 'gui-add-synthetic-contact-candidate-lab') { throw "Synthetic GUI contact and persistent identity controls missing" }
          if($source -notmatch 'contact-candidate-not-trusted' -or $source -notmatch 'mailAuthorized' -or $source -notmatch 'invitation' -and $source -notmatch 'code de test') { throw "Synthetic contact trust boundary missing" }

      - name: Publish rendered Windows interface captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Quantic-Sillage-UI-captures
          path: ${{ runner.temp }}/quantic-ui-captures/*.png
          if-no-files-found: error
