name: Windows Alpha native user interface

on:
  push:
    branches: ['feat/**', 'fix/**']
    paths:
      - 'scripts/Quantic-Sillage-Alpha.ps1'
      - 'scripts/Quantic-Sillage-GUI-Check.ps1'
      - 'scripts/Quantic-Sillage-Network-Check.ps1'
      - 'scripts/Quantic-Sillage-Scattering.ps1'
      - 'scripts/Quantic-Sillage-DirectMail.ps1'
      - 'scripts/native-two-host-network-lab.mjs'
      - 'desktop/native-two-host-network-lab.mjs'
      - 'tests/native-two-host-network-lab.test.mjs'
      - 'tests/native-two-host-cli-e2e.test.mjs'
      - 'scripts/Quantic-Sillage-Compose.ps1'
      - 'scripts/Quantic-Sillage-Advanced.ps1'
      - 'scripts/native-windows-compose-draft.mjs'
      - 'desktop/native-windows-draft.mjs'
      - 'desktop/native-windows-gui-send.mjs'
      - 'desktop/native-windows-mail-status.mjs'
      - 'tests/native-windows-mail-status.test.mjs'
      - 'desktop/native-windows-mail-status.mjs'
      - 'tests/native-windows-mail-status.test.mjs'
      - 'tests/native-windows-gui-send.test.mjs'
      - 'tests/native-windows-draft.test.mjs'
      - 'scripts/Quantic-Sillage-Alpha.nsi'
      - '.github/workflows/windows-alpha-native-ui.yml'
  pull_request:
    paths:
      - 'scripts/Quantic-Sillage-Alpha.ps1'
      - 'scripts/Quantic-Sillage-GUI-Check.ps1'
      - 'scripts/Quantic-Sillage-Network-Check.ps1'
      - 'scripts/Quantic-Sillage-Scattering.ps1'
      - 'scripts/Quantic-Sillage-DirectMail.ps1'
      - 'scripts/native-two-host-network-lab.mjs'
      - 'desktop/native-two-host-network-lab.mjs'
      - 'tests/native-two-host-network-lab.test.mjs'
      - 'tests/native-two-host-cli-e2e.test.mjs'
      - 'scripts/Quantic-Sillage-Compose.ps1'
      - 'scripts/Quantic-Sillage-Advanced.ps1'
      - 'scripts/native-windows-compose-draft.mjs'
      - 'desktop/native-windows-draft.mjs'
      - 'desktop/native-windows-gui-send.mjs'
      - 'tests/native-windows-gui-send.test.mjs'
      - 'tests/native-windows-draft.test.mjs'
      - 'scripts/Quantic-Sillage-Alpha.nsi'
      - '.github/workflows/windows-alpha-native-ui.yml'

permissions:
  contents: read

jobs:
  windows-native-winform:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify Windows Forms syntax and categorized native actions
        shell: pwsh
        run: |
          foreach($candidate in @('./scripts/Quantic-Sillage-Alpha.ps1','./scripts/Quantic-Sillage-GUI-Check.ps1','./scripts/Quantic-Sillage-Network-Check.ps1','./scripts/Quantic-Sillage-Scattering.ps1','./scripts/Quantic-Sillage-DirectMail.ps1','./scripts/Quantic-Sillage-Compose.ps1','./scripts/Quantic-Sillage-Advanced.ps1')) {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile((Resolve-Path $candidate).Path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){throw ("Invalid PowerShell "+$candidate+": "+($errors -join "; "))}
          }
          $path = (Resolve-Path ./scripts/Quantic-Sillage-Alpha.ps1).Path
          $tok=$null; $errors=$null
          $null=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tok,[ref]$errors)
          if ($errors.Count -gt 0) { throw ("Invalid Windows Alpha UI: "+($errors -join "; ")) }
          $runner = Join-Path $env:SystemRoot "System32/WindowsPowerShell/v1.0/powershell.exe"
          & $runner -NoProfile -STA -NonInteractive -File $path -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Native Alpha UI modules or field constraints rejected" }
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-Compose.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Native composer self-test failed"}
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-GUI-Check.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Windows native GUI operator contract refused"}
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-Network-Check.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Windows two-host GUI contract refused"}
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-Scattering.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Windows Scattering rotation GUI contract refused"}
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-DirectMail.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Windows direct mail GUI contract refused"}
          & $runner -NoProfile -STA -NonInteractive -File ./scripts/Quantic-Sillage-Advanced.ps1 -ExpectedManifestSha256 ("a"*64) -TrustedBinarySha256 ("b"*64) -SelfTest
          if($LASTEXITCODE -ne 0){throw "Explicit advanced contract failed"}
          node --test tests/native-windows-draft.test.mjs tests/native-windows-gui-send.test.mjs tests/native-windows-mail-status.test.mjs tests/native-two-host-network-lab.test.mjs tests/native-two-host-cli-e2e.test.mjs
          if($LASTEXITCODE -ne 0){throw "Draft validation failed"}
          $source = Get-Content -LiteralPath $path -Raw
          if ($source -match "(?i)WebBrowser|WebView2|loadURL|onrender\.com") { throw "Remote renderer reintroduced" }
