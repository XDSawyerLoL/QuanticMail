name: Scattering repeated timing and latency lab

on:
  push:
    branches:
      - "feat/scattering-mix-compare-*"
    paths:
      - ".github/workflows/scattering-repeated-lab.yml"
      - "lib/quantic/scattering-repeat-summary-lab.mjs"
      - "tests/scattering-repeat-summary.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: balanced-fifo
            batch: "0"
            mix: "0"
            b_real: "100"
          - name: balanced-batch-8
            batch: "8"
            mix: "1"
            b_real: "100"
          - name: skewed-fifo
            batch: "0"
            mix: "0"
            b_real: "20"
          - name: skewed-batch-8
            batch: "8"
            mix: "1"
            b_real: "20"
    name: "Five repeats / ${{ matrix.name }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install virtual network and capture tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 tcpdump
      - name: Check summary and per-source metrics
        run: node --test tests/scattering-repeat-summary.test.mjs tests/scattering-fifo-timing-observer.test.mjs
      - name: Compile native Go pacer
        working-directory: labs/quantic-native/scattering/native
        run: go build -trimpath -o "$RUNNER_TEMP/Quantic-Pacer" .
      - name: Repeat isolated native network experiments
        env:
          SCATTERING_MULTIHOP_CPU_LOAD: "0"
          SCATTERING_MULTIHOP_IMPAIRMENT: "0"
          SCATTERING_MULTIHOP_RESEAL: "1"
          SCATTERING_MULTIHOP_E2E: "1"
          SCATTERING_MULTIHOP_MIX: ${{ matrix.mix }}
          SCATTERING_MULTIHOP_B_REAL_CELLS: ${{ matrix.b_real }}
          SCATTERING_MULTIHOP_BATCH_SIZE: ${{ matrix.mix == '1' && matrix.batch || '8' }}
          SUMMARY_BATCH: ${{ matrix.batch }}
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d "$RUNNER_TEMP/scattering-repeated-XXXXXX")"
          trap 'rm -rf -- "$dir"' EXIT
          for i in 1 2 3 4 5; do
            export SCATTERING_MULTIHOP_SOURCE_OFFSET_MS="$(( (i % 2) * 25 ))"
            bash scripts/scattering-multihop-netns-lab.sh "$RUNNER_TEMP/Quantic-Pacer" > "$dir/run-$i.json"
            echo "Completed isolated repeat $i/5"
          done
          node lib/quantic/scattering-repeat-summary-lab.mjs "$SUMMARY_BATCH" "$SCATTERING_MULTIHOP_B_REAL_CELLS" 5 "$dir"/run-*.json
