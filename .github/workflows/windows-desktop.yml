name: QuanticMail - installateur Windows local

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/windows-quanticmail-installer-*"
    paths:
      - "desktop/**"
      - "scripts/build-desktop.mjs"
      - "scripts/build-hostinger-static.mjs"
      - "scripts/generate-desktop-icon.mjs"
      - "scripts/smoke-desktop.mjs"
      - "tests/desktop-*.test.mjs"
      - "package.json"
      - ".github/workflows/windows-desktop.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Installer les dependances
        run: npm install --no-audit --no-fund
      - name: Tester la navigation et le serveur local
        run: node --test tests/desktop-navigation.test.mjs tests/desktop-local.test.mjs
      - name: Compiler l'application Windows et son relais embarque
        run: npm run desktop:dist
      - name: Controler la presence de l'installateur
        shell: pwsh
        run: |
          if (-not (Test-Path desktop-dist/QuanticMail-Setup-1.3.1.exe)) {
            throw "Installateur Quantic Mail introuvable"
          }
      - name: Publier l'installateur Windows
        uses: actions/upload-artifact@v4
        with:
          name: quanticmail-windows-local
          path: desktop-dist/QuanticMail-Setup-1.3.1.exe
          if-no-files-found: error
          retention-days: 14

  publish-direct-exe:
    name: Publier le EXE direct sur GitHub Releases
    if: (github.event_name == 'push' && github.ref_name == 'feat/windows-quanticmail-installer-20261113') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/windows-quanticmail-installer-20261113')
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer l'installateur EXE
        uses: actions/download-artifact@v4
        with:
          name: quanticmail-windows-local
          path: release
      - name: Publier le téléchargement direct (sans ZIP)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          exe="release/QuanticMail-Setup-1.3.1.exe"
          test -s "$exe"
          tag="v1.3.1-windows-local-preview.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$exe" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --prerelease \
              --title "Quantic Mail 1.3.1 Windows local (préversion)" \
              --notes "Installateur Windows direct au format .exe. Interface et relais locaux, aucune page Hostinger nécessaire. Version alpha non signée : sauvegardez votre Identity Vault avant installation. L'acheminement entre deux PC derrière des box distinctes sans relais public reste à valider."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,url
