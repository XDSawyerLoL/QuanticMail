name: Sentinel native Identity Vault proof interoperability
on:
  push:
    paths: ['quantic-control/**', '.github/workflows/sentinel-vault-proof.yml']
  pull_request:
    paths: ['quantic-control/**', '.github/workflows/sentinel-vault-proof.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-pq:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 10
    env:
      CGO_ENABLED: '1'
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git golang-go gcc libc6-dev pkg-config libssl-dev openssl
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 337a8311f0a980a5dd61520555465ea06d18552c
          path: native-vault-source
          persist-credentials: false
      - name: Verify Sentinel public-key verifier using real OpenSSL
        working-directory: quantic-control
        run: go test -count=1 -tags pqopenssl -v ./vaultsession
      - name: Verify proof generated by actual existing native Vault code
        shell: bash
        run: |
          set -euo pipefail
          control="$PWD/quantic-control"
          cd native-vault-source/labs/quantic-native/vault
          cp "$control/vaultsession/testdata/native_vault_interop_test.go.txt" sentinel_interop_test.go
          go mod edit -require=github.com/XDSawyerLoL/QuanticMail/quantic-control@v0.0.0
          go mod edit -replace=github.com/XDSawyerLoL/QuanticMail/quantic-control="$control"
          go test -count=1 -tags pqopenssl -v -timeout 90s -run TestSentinel .
  windows-pq:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 337a8311f0a980a5dd61520555465ea06d18552c
          path: native-vault-source
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c6d2266e83a573f7b3c1e582a521fc03303f37cf
          path: native-vault-gui-source
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-nsis
      - name: Real Windows OpenSSL verifier and existing native Vault proof
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=gcc PKG_CONFIG=pkg-config
          control="$PWD/quantic-control"
          cd "$control"
          go test -count=1 -tags pqopenssl -v ./vaultsession
          go build -tags 'pqopenssl pqstatic' -ldflags="-H windowsgui -linkmode external -extldflags=-static" -o sentinel-pq-gui-ci.exe ./cmd/quantic-control-sentinel
          # A resident install currently copies only the executable. Refuse
          # any external non-system dependency in Sentinel itself.
          objdump -p sentinel-pq-gui-ci.exe | awk '/DLL Name:/ {print $3}' | tr -d '\r' > sentinel-imports.txt
          while IFS= read -r dll; do
            lower="$(printf '%s' "$dll" | tr A-Z a-z)"
            case "$lower" in api-ms-win-*|ext-ms-win-*) continue ;; esac
            test -f "/c/Windows/System32/$dll" || { echo "Non-system Sentinel import: $dll"; exit 1; }
          done < sentinel-imports.txt
          go test -c -o sentinel-install-ci.test.exe ./cmd/quantic-control-sentinel
          cd ../native-vault-source/labs/quantic-native/vault
          cp "$control/vaultsession/testdata/native_vault_interop_test.go.txt" sentinel_interop_test.go
          go mod edit -require=github.com/XDSawyerLoL/QuanticMail/quantic-control@v0.0.0
          go mod edit -replace=github.com/XDSawyerLoL/QuanticMail/quantic-control="$(cygpath -w "$control")"
          go test -count=1 -tags pqopenssl -v -timeout 90s -run TestSentinel .
      - name: Build native graphical Vault and assemble Sentinel PQ package
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export CC=gcc PKG_CONFIG=pkg-config
          root="$PWD"
          cd native-vault-gui-source/labs/quantic-native/vault
          grep -q -- '--broker-windows-pq-quorum-gui-lab' windows_broker.go
          go build -tags pqopenssl -o vault-pq-gui-ci.exe .
          cd "$root"
          bash quantic-control/scripts/package-sentinel-pq-windows.sh \
            "$root/quantic-control/sentinel-pq-gui-ci.exe" \
            "$root/native-vault-gui-source/labs/quantic-native/vault/vault-pq-gui-ci.exe" \
            "$root/sentinel-pq-package" "$GITHUB_SHA" c6d2266e83a573f7b3c1e582a521fc03303f37cf
      - name: Verify packaged PQ provider with no MSYS2 search path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path 'sentinel-pq-package').Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:OPENSSL_CONF,Env:OPENSSL_MODULES,Env:OPENSSL_CONF_INCLUDE -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$package\QuanticSentinel.exe" -ArgumentList '--selftest-pq-provider' -WorkingDirectory $package -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged ML-DSA provider not available: $($p.ExitCode)" }
          Write-Host 'Packaged ML-DSA-65 provider available without MSYS2 PATH'
          $env:QUANTIC_SENTINEL_TEST_BINARY = "$package\QuanticSentinel.exe"
          $test = (Resolve-Path 'quantic-control/sentinel-install-ci.test.exe').Path
          & $test '-test.v' '-test.count=1' '-test.timeout=90s' '-test.run=^TestActualResidentBinaryInstallationE2E$'
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Sentinel resident install failed' }

      - name: Upload unsigned native PQ Alpha package
        uses: actions/upload-artifact@v4
        with:
          name: quantic-sentinel-vault-native-pq-windows-unsigned
          path: sentinel-pq-package/
          if-no-files-found: error
          retention-days: 7
      - name: Generate verified installer inventory
        shell: pwsh
        run: |
          node quantic-control/scripts/generate-sentinel-uninstall.mjs sentinel-pq-package sentinel-uninstall.nsh sentinel-checks.nsh
          if ($LASTEXITCODE -ne 0) { throw 'Inventory refused' }
      - name: Build single native Windows setup EXE
        shell: msys2 {0}
        run: |
          set -euo pipefail
          /ucrt64/bin/makensis.exe \
            "/DOUTPUT_EXE=$(cygpath -w "$PWD/Quantic-Sentinel-Suite-Setup-UNSIGNED.exe")" \
            "/DPACKAGE_DIR=$(cygpath -w "$PWD/sentinel-pq-package")" \
            "/DUNINSTALL_LIST_NSH=$(cygpath -w "$PWD/sentinel-uninstall.nsh")" \
            "/DUNINSTALL_CHECKS_NSH=$(cygpath -w "$PWD/sentinel-checks.nsh")" \
            "/DBUILD_ID=$(printf %.12s "$GITHUB_SHA")" \
            "$(cygpath -w "$PWD/quantic-control/scripts/Quantic-Sentinel-Suite.nsi")"
      - name: Actual setup and exact uninstall on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'Quantic-Sentinel-Suite-Setup-UNSIGNED.exe').Path
          $build = $env:GITHUB_SHA.Substring(0,12)
          $installed = Join-Path $env:LOCALAPPDATA "QuanticSillage\SentinelSuite-$build"
          if (Test-Path -LiteralPath $installed) { throw 'Unexpected prior installation' }
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
          $package = (Resolve-Path 'sentinel-pq-package').Path
          function Assert-Payload {
            foreach ($file in Get-ChildItem -LiteralPath $package -Recurse -File) {
              $relative = $file.FullName.Substring($package.Length + 1)
              $target = Join-Path $installed $relative
              if ((Get-FileHash -LiteralPath $target).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) { throw "Payload mismatch: $relative" }
            }
          }
          Assert-Payload
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath "$installed\QuanticSentinel.exe" -ArgumentList '--selftest-pq-provider' -WorkingDirectory $installed -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installed Sentinel cryptography probe failed' }
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -eq 0) { throw 'Setup accepted existing version' }
          Assert-Payload
          $unknown = Join-Path $installed 'user-kept.txt'
          $vault = Join-Path $env:RUNNER_TEMP 'independent-synthetic-vault.txt'
          [IO.File]::WriteAllText($unknown,'keep')
          [IO.File]::WriteAllText($vault,'keep vault')
          $copy = Join-Path $env:RUNNER_TEMP 'Uninstall-Sentinel-CI.exe'
          Copy-Item -LiteralPath "$installed\Uninstall-QuanticSentinelSuite.exe" -Destination $copy
          $args = "/S _?=$installed"
          $p = Start-Process -FilePath $copy -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -eq 0 -or [IO.File]::ReadAllText($unknown) -ne 'keep') { throw 'Unknown user data not preserved' }
          Remove-Item -LiteralPath $unknown
          $p = Start-Process -FilePath $copy -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path -LiteralPath $installed)) { throw "Exact uninstall failed: $($p.ExitCode)" }
          if ([IO.File]::ReadAllText($vault) -ne 'keep vault') { throw 'Independent vault changed' }
          if (Test-Path -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\QuanticSentinelSuite-$build") { throw 'Uninstall registry entry remains' }
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -eq 'Valid') { throw 'Unexpected signature on unsigned build' }
          (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -LiteralPath "$setup.sha256"
          Write-Host 'Native setup, duplicate refusal, installed PQ provider and targeted uninstall passed'
      - name: Upload tested single-file native setup (unsigned Alpha)
        uses: actions/upload-artifact@v4
        with:
          name: quantic-sentinel-suite-setup-windows-unsigned
          path: |
            Quantic-Sentinel-Suite-Setup-UNSIGNED.exe
            Quantic-Sentinel-Suite-Setup-UNSIGNED.exe.sha256
          if-no-files-found: error
          retention-days: 7
