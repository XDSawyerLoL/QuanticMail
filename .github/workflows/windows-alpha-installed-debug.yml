name: Diagnose installed Alpha Windows GUI startup

on:
  push:
    branches: ['fix/**']
    paths:
      - '.github/workflows/windows-alpha-installed-debug.yml'
      - 'cmd/quantic-alpha-launcher/**'

permissions:
  contents: read
  actions: read

jobs:
  direct-packaged-gui:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore exact previously compiled Windows package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "QuanticMail-Debug"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh run download 45174826809 --repo XDSawyerLoL/QuanticMail -n QuanticMail-Windows-PQ-Lab-unsigned -D $dir
          if ($LASTEXITCODE -ne 0) { throw "Cannot load earlier Windows package" }
          if (-not (Test-Path "$dir\Start-Windows-PQ-Lab.ps1")) { throw "Package incomplete" }
      - name: Compile current native launcher and verify local files
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "QuanticMail-Debug"
          $exe=Join-Path $dir "bin\Quantic-Sillage-Launcher.exe"
          $env:CGO_ENABLED="0"
          go build -trimpath -ldflags "-H windowsgui" -o $exe cmd/quantic-alpha-launcher/main.go
          if ($LASTEXITCODE -ne 0) { throw "Native bootstrap rebuild failed" }
          $manifest=Join-Path $dir "SHA256SUMS.txt"
          $digest=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines=@(Get-Content -LiteralPath $manifest)
          $changed=0
          $lines=@($lines | ForEach-Object {
            if ($_ -match '\*\./bin/Quantic-Sillage-Launcher\.exe$') {
              $changed++
              "$digest *./bin/Quantic-Sillage-Launcher.exe"
            } else { $_ }
          })
          if ($changed -ne 1) { throw "Launcher absent in old package manifest" }
          [IO.File]::WriteAllLines($manifest,$lines,[Text.UTF8Encoding]::new($false))
          $pin=(Get-FileHash $manifest -Algorithm SHA256).Hash
          & ./scripts/Test-Windows-PQ-Package.ps1 -PackageDirectory $dir -ExpectedManifestSha256 $pin
      - name: Real packaged dashboard direct vs native GUI child
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP "QuanticMail-Debug"
          $manifestPin=(Get-FileHash "$dir\SHA256SUMS.txt" -Algorithm SHA256).Hash.ToLowerInvariant()
          $vaultPin=(Get-FileHash "$dir\bin\Vault-PQ-lab.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $shell=Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          $params=@("-NoLogo","-NoProfile","-STA","-ExecutionPolicy","Bypass","-File","$dir\Start-Windows-PQ-Lab.ps1","-Operation","DashboardCheck","-ExpectedManifestSha256",$manifestPin,"-TrustedBinarySha256",$vaultPin)
          & $shell @params
          $firstExit=$LASTEXITCODE
          Write-Host "DIRECT_DASHBOARD_EXIT=$firstExit"
          $p=Start-Process -FilePath "$dir\bin\Quantic-Sillage-Launcher.exe" -ArgumentList "$manifestPin $vaultPin --smoke-ui" -Wait -PassThru
          Write-Host "NATIVE_GUI_EXIT=$($p.ExitCode)"
          $diagnostic=Join-Path $env:TEMP "quantic-alpha-ui-ci.log"
          if(Test-Path -LiteralPath $diagnostic){Write-Host "CI CHILD DIAGNOSTIC:";Get-Content -LiteralPath $diagnostic}
          if ($firstExit -ne 0 -or $p.ExitCode -ne 0) { throw "Packaged UI actual launch regression" }
