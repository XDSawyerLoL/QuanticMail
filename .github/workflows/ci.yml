name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Build Hostinger static Mail surface
        run: |
          npm run build:hostinger
          test -f out/index.html
          test -f out/network/index.html
          test -f out/vault/index.html
          grep -q '/mail/_next/' out/index.html
      - run: npm run lint
      - name: Smoke standalone Quantic Relay CLI
        shell: bash
        run: |
          set -euo pipefail
          export QUANTIC_RELAY_HOST=127.0.0.1
          export QUANTIC_RELAY_PORT=8787
          export QUANTIC_RELAY_DATA_DIR="$RUNNER_TEMP/quantic-relay-smoke"

          node --experimental-transform-types standalone-relay/main.ts \
            >"$RUNNER_TEMP/quantic-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true; wait "$relay_pid" 2>/dev/null || true' EXIT

          healthy=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8787/api/quantic/health \
              >"$RUNNER_TEMP/quantic-relay-health.json"; then
              healthy=1
              break
            fi
            sleep 0.25
          done

          if [[ "$healthy" -ne 1 ]]; then
            cat "$RUNNER_TEMP/quantic-relay.log"
            exit 1
          fi

          grep -q '"protocol":"quantic-relay/1"' "$RUNNER_TEMP/quantic-relay-health.json"
          kill -TERM "$relay_pid"
          wait "$relay_pid"
          trap - EXIT

          test -f "$QUANTIC_RELAY_DATA_DIR/relay-state.json"
      - name: Validate VPS bootstrap script
        run: bash -n scripts/bootstrap-mail-vps.sh
      - name: Validate production mail compose
        run: MAIL_SERVER_HOSTNAME=mx.example.com docker compose -f docker-compose.production.yml config >/dev/null


  node22-runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import PQC runtime without Node 24 APIs
        run: |
          node --experimental-transform-types --input-type=module <<'NODE'
          const runtime = await import('./lib/quantic/pqc-runtime-node.ts');
          const capabilities = runtime.detectPqcCapabilities();
          if (!capabilities || typeof capabilities.runtime !== 'string') {
            throw new Error('PQC capability detection did not return a valid payload.');
          }
          console.log(JSON.stringify(capabilities));
          NODE
