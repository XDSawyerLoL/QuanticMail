name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - run: npm install
      - run: npm test
      - name: Real authenticated mailbox through two independent native Scattering UDP links
        shell: bash
        run: |
          set -euo pipefail
          cd labs/quantic-native/scattering/native
          go build -trimpath -o "$RUNNER_TEMP/Quantic-Pacer" .
          cd "$GITHUB_WORKSPACE"
          QUANTIC_INTEGRATED_SCATTERING_BINARY="$RUNNER_TEMP/Quantic-Pacer" node --experimental-transform-types --test --test-name-pattern="integrated native relay" tests/native-identity-bridge.test.mjs
      - run: npm run build
      - name: Build Hostinger static Mail surface
        run: |
          npm run build:hostinger
          test -f out/index.html
          test -f out/network/index.html
          test -f out/vault/index.html
          grep -q '/mail/_next/' out/index.html
      - run: npm run lint
      - name: Smoke standalone Quantic Relay CLI
        shell: bash
        run: |
          set -euo pipefail
          export QUANTIC_RELAY_HOST=127.0.0.1
          export QUANTIC_RELAY_PORT=8787
          export QUANTIC_RELAY_DATA_DIR="$RUNNER_TEMP/quantic-relay-smoke"

          node --experimental-transform-types standalone-relay/main.ts \
            >"$RUNNER_TEMP/quantic-relay.log" 2>&1 &
          relay_pid=$!
          trap 'kill "$relay_pid" 2>/dev/null || true; wait "$relay_pid" 2>/dev/null || true' EXIT

          healthy=0
          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8787/api/quantic/health \
              >"$RUNNER_TEMP/quantic-relay-health.json"; then
              healthy=1
              break
            fi
            sleep 0.25
          done

          if [[ "$healthy" -ne 1 ]]; then
            cat "$RUNNER_TEMP/quantic-relay.log"
            exit 1
          fi

          grep -q '"protocol":"quantic-relay/1"' "$RUNNER_TEMP/quantic-relay-health.json"
          kill -TERM "$relay_pid"
          wait "$relay_pid"
          trap - EXIT

          test -f "$QUANTIC_RELAY_DATA_DIR/relay-state.json"
      - name: Validate VPS bootstrap script
        run: bash -n scripts/bootstrap-mail-vps.sh
      - name: Validate production mail compose
        run: MAIL_SERVER_HOSTNAME=mx.example.com docker compose -f docker-compose.production.yml config >/dev/null


  pay-native-network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: legacy
            files: tests/pay-scattering.test.mjs tests/pay-witness-service.test.mjs tests/pay-round-service.test.mjs tests/pay-replica-service.test.mjs
          - suite: recovery
            files: tests/pay-committee-recovery-service.test.mjs
          - suite: vote
            files: tests/pay-committee-vote-service.test.mjs
          - suite: distributed
            files: tests/pay-committee-distributed.test.mjs
          - suite: byzantine
            files: tests/pay-committee-byzantine-network.test.mjs
          - suite: strict
            files: tests/pay-unanimous-service.test.mjs
          - suite: batch-native
            files: tests/pay-batch-native.test.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - name: Build native carrier
        run: |
          cd labs/quantic-native/scattering/native
          go build -trimpath -o "$RUNNER_TEMP/Quantic-Pacer" .
      - name: Mandatory native Pay network suite
        env:
          PAY_SUITE_FILES: ${{ matrix.files }}
        run: |
          export QUANTIC_PAY_SCATTERING_TEST="$RUNNER_TEMP/Quantic-Pacer"
          export QUANTIC_PAY_COMMITTEE_DISTRIBUTED_TEST="$RUNNER_TEMP/Quantic-Pacer"
          node --test --test-concurrency=1 $PAY_SUITE_FILES

  pay-strict-full-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - name: Mandatory 16 strict voters and 64 independent TLS anchor services
        run: QUANTIC_PAY_FULL_STRICT_TEST=1 node --test tests/pay-unanimous-full-service.test.mjs

  node22-runtime-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import PQC runtime without Node 24 APIs
        run: |
          node --experimental-transform-types --input-type=module <<'NODE'
          const runtime = await import('./lib/quantic/pqc-runtime-node.ts');
          const capabilities = runtime.detectPqcCapabilities();
          if (!capabilities || typeof capabilities.runtime !== 'string') {
            throw new Error('PQC capability detection did not return a valid payload.');
          }
          console.log(JSON.stringify(capabilities));
          NODE

  shared-auth-rate-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quantic_test
          POSTGRES_PASSWORD: quantic_test_only
          POSTGRES_DB: quantic_rate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantic_test -d quantic_rate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUANTIC_AUTH_RATE_TEST_DATABASE_URL: postgresql://quantic_test:quantic_test_only@127.0.0.1:5432/quantic_rate_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - run: npm install
      - run: node --experimental-transform-types --test tests/shared-auth-rate.test.mjs tests/audit-session-web.test.mjs
