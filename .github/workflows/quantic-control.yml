name: Quantic Control Alpha 1

on:
  push:
    paths:
      - 'quantic-control/**'
      - '.github/workflows/quantic-control.yml'
  pull_request:
    paths:
      - 'quantic-control/**'
      - '.github/workflows/quantic-control.yml'
  workflow_dispatch:

jobs:
  native-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: quantic-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: quantic-control/go.mod
          cache-dependency-path: quantic-control/go.mod
      - name: Test
        run: go test ./...
      - name: Read actual Defender protection configuration (explicit SKIP if unavailable)
        if: runner.os == 'Windows'
        run: go test -v -count=1 -run TestSystemDefenderReadOnlyProbe ./sentinel
      - name: Defender Event Log API smoke (explicitly reports SKIP)
        if: runner.os == 'Windows'
        run: go test -v -run TestReadNativeDefenderEventLogWithoutModification ./sentinel
      - name: Race test (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build agent prototype
        run: go build -o quantic-control-alpha${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/quantic-control

      - name: Compile real Win32 GUI without console
        if: runner.os == 'Windows'
        run: go build -ldflags="-H windowsgui" -o quantic-control-gui-alpha.exe ./cmd/quantic-control-gui
      - name: Verify PE Windows GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("quantic-control-gui-alpha.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "Console subsystem detected; Windows GUI binary required" }
      - name: Upload Windows GUI Alpha (unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quantic-control-native-gui-windows-unsigned
          path: quantic-control/quantic-control-gui-alpha.exe
          if-no-files-found: error
          retention-days: 7
      - name: Compile Windows Sentinel (no console)
        if: runner.os == 'Windows'
        run: go build -ldflags="-H windowsgui" -o quantic-sentinel-alpha.exe ./cmd/quantic-control-sentinel
      - name: Verify Sentinel native GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes("quantic-sentinel-alpha.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $subsystem = [BitConverter]::ToInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "Sentinel must be a native GUI binary, not a console application" }
      - name: Validate publisher signing script syntax without a certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "./scripts/sign-sentinel.ps1").Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("Invalid signing script: " + ($parseErrors | Out-String)) }
      - name: Actual resident install / alert / uninstall Windows E2E
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QUANTIC_SENTINEL_TEST_BINARY = (Resolve-Path "./quantic-sentinel-alpha.exe").Path
          go test -v -count=1 -timeout 90s -run TestActualResidentBinaryInstallationE2E ./cmd/quantic-control-sentinel
      - name: Security 4663 read-only Event Log smoke
        if: runner.os == 'Windows'
        run: go test -v -count=1 -run TestNativeSecurityFileAuditWithoutModification ./sentinel
      - name: Upload Sentinel unsigned Windows lab executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quantic-sentinel-alpha-windows-unsigned
          path: quantic-control/quantic-sentinel-alpha.exe
          if-no-files-found: error
          retention-days: 7
      - name: Smoke native Windows executable
        if: runner.os == 'Windows'
        run: ./quantic-control-alpha.exe status
      - name: Upload unsigned Windows laboratory binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quantic-control-alpha1-windows-unsigned
          path: quantic-control/quantic-control-alpha.exe
          if-no-files-found: error
          retention-days: 7
