name: Quantic Control Alpha 1

on:
  push:
    paths:
      - 'quantic-control/**'
      - '.github/workflows/quantic-control.yml'
  pull_request:
    paths:
      - 'quantic-control/**'
      - '.github/workflows/quantic-control.yml'
  workflow_dispatch:

jobs:
  native-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: quantic-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: quantic-control/go.mod
          cache-dependency-path: quantic-control/go.mod
      - name: Test
        run: go test ./...
      - name: Race test (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build agent prototype
        run: go build -o quantic-control-alpha${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/quantic-control

      - name: Smoke native Windows executable
        if: runner.os == 'Windows'
        run: ./quantic-control-alpha.exe status
      - name: Upload unsigned Windows laboratory binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: quantic-control-alpha1-windows-unsigned
          path: quantic-control/quantic-control-alpha.exe
          if-no-files-found: error
          retention-days: 7
