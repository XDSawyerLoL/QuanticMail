name: Quantic Control Alpha 1

on:
  push:
    paths:
      - 'quantic-control/**'
      - '.github/workflows/quantic-control.yml'
  pull_request:
    paths:
      - 'quantic-control/**'
      - '.github/workflows/quantic-control.yml'
  workflow_dispatch:

jobs:
  native-control:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: quantic-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: quantic-control/go.mod
          cache-dependency-path: quantic-control/go.mod
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build agent prototype
        run: go build -o quantic-control-alpha${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/quantic-control
