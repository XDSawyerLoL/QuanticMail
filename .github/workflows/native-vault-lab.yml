name: Native Vault laboratory
on:
  pull_request:
    branches: [main]
    paths: ['labs/quantic-native/**', 'desktop/**', 'lib/quantic/**', 'scripts/native-vault-windows-local.mjs', 'scripts/package-windows-pq-lab.sh', 'scripts/scattering-physical-probe.mjs', 'scripts/Start-Windows-PQ-Lab.ps1', 'tests/native-windows-desktop.test.mjs', 'tests/native-windows-mail-flow.test.mjs', 'tests/native-scattering-mailbox.test.mjs', 'standalone-relay/native-scattering-mailbox.mjs', 'scripts/serve-native-scattering-windows.mjs', 'scripts/native-vault-windows-mailbox.mjs', '.github/workflows/native-vault-lab.yml']
  push:
    branches: [main, "feat/**"]
    paths: ['labs/quantic-native/**', 'desktop/**', 'lib/quantic/**', 'scripts/native-vault-windows-local.mjs', 'scripts/package-windows-pq-lab.sh', 'scripts/scattering-physical-probe.mjs', 'scripts/Start-Windows-PQ-Lab.ps1', 'tests/native-windows-desktop.test.mjs', 'tests/native-windows-mail-flow.test.mjs', 'tests/native-scattering-mailbox.test.mjs', 'standalone-relay/native-scattering-mailbox.mjs', 'scripts/serve-native-scattering-windows.mjs', 'scripts/native-vault-windows-mailbox.mjs', '.github/workflows/native-vault-lab.yml']
permissions:
  contents: read
jobs:
  native-linux-pq:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:trixie-slim
    env:
      DEBIAN_FRONTEND: noninteractive
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install native build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git golang-go gcc libc6-dev pkg-config libssl-dev openssl python3 python3-cryptography nodejs
          openssl version
          openssl list -kem-algorithms | grep -qi ML-KEM-768
          openssl list -signature-algorithms | grep -qi ML-DSA-65
          go version
          node --version
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Configure trusted CI checkout
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain
      - name: Verify exact frozen source inventory
        working-directory: labs/quantic-native
        run: python3 verify_sources.py
      - name: Build carrier from source
        working-directory: labs/quantic-native/scattering/native
        run: |
          go test -count=1 ./...
          go build -trimpath -o ../QuanticNativePacer_v7_1_linux_amd64 .
      - name: Native Scattering mailbox traffic over UDP
        run: QUANTIC_SCATTERING_NATIVE_TEST="$GITHUB_WORKSPACE/labs/quantic-native/scattering/QuanticNativePacer_v7_1_linux_amd64" node --test tests/native-scattering-mailbox.test.mjs
      - name: Vault default and PQ build and tests
        working-directory: labs/quantic-native/vault
        run: |
          go test -count=1 ./...
          go test -count=1 -tags pqopenssl ./...
          go vet -tags pqopenssl ./...
          go build -trimpath -tags pqopenssl -o VaultIsolated-linux .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/VaultIsolated-Windows-nonPQ.exe .
      - name: Authority and native enrolment regressions
        working-directory: labs/quantic-native
        run: |
          node --test vault/tests/*.test.mjs scattering/compact-pacing.test.mjs scattering/dual-proof-pacing.test.mjs
          cd vault
          python3 -m unittest test_pq_dual_unit test_schedule_unit test_dual_proof_feed test_contact_proof_feed -v
      - name: Real local dual-authority network and PQ-only revocation
        working-directory: labs/quantic-native/vault
        run: timeout 180s python3 -u test_pq_dual_network.py

  native-windows-pq-provider:
    # Synthetic provider-only test. No release, no account keys, no physical TPM claim.
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
      - name: Compile and exercise real Windows PQ provider
        shell: msys2 {0}
        working-directory: labs/quantic-native/vault
        run: |
          set -euo pipefail
          export CC=gcc
          export PKG_CONFIG=pkg-config
          go version
          openssl version
          openssl list -kem-algorithms | grep -qi ML-KEM-768
          openssl list -signature-algorithms | grep -qi ML-DSA-65
          go test -count=1 -tags pqopenssl -run '^(TestPQProviderRoundTrip|TestWindowsPrivateStorage|TestWindowsPQStorageReopen|TestWindowsProvisionJournalRestart|TestWindowsConsoleParsing|TestWindowsRecoveryExactResult|TestWindowsQuorumConfigRefusal|TestWindowsScatteringEpochGuard)$' -v .
          go build -trimpath -tags pqopenssl -o "$RUNNER_TEMP/Vault-PQ-provider-lab.exe" .
          cd ../scattering/native
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/Scattering-Pacer.exe" .

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0
      - name: Windows trusted client workflow regressions
        run: node --test tests/native-windows-desktop.test.mjs tests/native-vault-controller.test.mjs tests/native-windows-mail-flow.test.mjs
      - name: Stage isolated portable Windows laboratory
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash scripts/package-windows-pq-lab.sh "$RUNNER_TEMP/Vault-PQ-provider-lab.exe" "$RUNNER_TEMP/QuanticMail-Windows-PQ-Lab" "$RUNNER_TEMP/Scattering-Pacer.exe" "$(cygpath -w "$(command -v node.exe)")"
      - name: Windows native Scattering mailbox loopback using packaged binaries
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "QuanticMail-Windows-PQ-Lab"
          $node = "$dir\runtime\node.exe"
          $env:QUANTIC_WINDOWS_VAULT_TEST = "$dir\bin\Vault-PQ-lab.exe"
          $env:QUANTIC_SCATTERING_NATIVE_TEST = "$dir\bin\Scattering-Pacer.exe"
          $env:PATH = "$dir\bin;$env:SystemRoot\System32"
          & $node --test tests/native-scattering-mailbox.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Packaged Scattering mailbox failed" }
      - name: Verify packaged entry points and cryptography runtime
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "QuanticMail-Windows-PQ-Lab"
          $originalPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32"
            $provider = & "$dir\bin\Vault-PQ-lab.exe" --providers
            if ($LASTEXITCODE -ne 0) { throw "Packaged native executable failed" }
            $provider | Write-Output
          } finally { $env:PATH = $originalPath }
          $env:QV_PACKAGE = $dir
          & "$dir\runtime\node.exe" --experimental-transform-types --input-type=module -e "import {pathToFileURL} from 'node:url'; import {join} from 'node:path'; import {generateKeyPairSync} from 'node:crypto'; generateKeyPairSync('ml-kem-768'); generateKeyPairSync('ml-dsa-65'); await import(pathToFileURL(join(process.env.QV_PACKAGE,'desktop','native-windows-desktop.mjs')).href); await import(pathToFileURL(join(process.env.QV_PACKAGE,'lib','quantic','native-identity-bridge.mjs')).href); await import(pathToFileURL(join(process.env.QV_PACKAGE,'lib','quantic','migration-proof-node.mjs')).href); await import(pathToFileURL(join(process.env.QV_PACKAGE,'desktop','native-windows-mail-flow.mjs')).href);"
          if ($LASTEXITCODE -ne 0) { throw "Packaged Node bridge failed" }
          & "$dir\runtime\node.exe" "$dir\scripts\scattering-physical-probe.mjs" loopback "$dir\bin\Scattering-Pacer.exe" 5
          if ($LASTEXITCODE -ne 0) { throw "Packaged pacer loopback failed" }
          Get-Content "$dir\SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QuanticMail-Windows-PQ-Lab-unsigned
          path: ${{ runner.temp }}/QuanticMail-Windows-PQ-Lab/
          if-no-files-found: error
          retention-days: 7
