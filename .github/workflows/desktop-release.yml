name: QuanticMail Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
      - name: Refuse Windows release with unsupported security claims
        run: node scripts/assert-release-boundary.mjs --assert-desktop
      - name: Install dependencies
        run: npm install
      - name: Check embedded Electron native runtime gate
        run: node scripts/check-electron-embedded-node.cjs
      - name: Resolve desktop version
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" | ConvertFrom-Json
          "VERSION=$($pkg.version)" >> $env:GITHUB_ENV
          "TAG=quanticmail-desktop-v$($pkg.version)" >> $env:GITHUB_ENV
          "ASSET=desktop-dist/QuanticMail-Setup-$($pkg.version).exe" >> $env:GITHUB_ENV
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Attach security posture to signed legacy installer release
        shell: pwsh
        run: node scripts/assert-release-boundary.mjs --assert-desktop | Out-File -Encoding utf8 desktop-dist/QUANTIC_RELEASE_AUDIT.json
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QUANTIC_WINDOWS_SIGNER_SHA256: ${{ vars.QUANTIC_WINDOWS_SIGNER_SHA256 }}
        run: |
          $pin = "$env:QUANTIC_WINDOWS_SIGNER_SHA256".Trim().ToLowerInvariant()
          if ($pin -notmatch '^[0-9a-f]{64}$') {
            throw "Publication refusée : empreinte SHA256 du certificat éditeur non configurée."
          }
          $signature = Get-AuthenticodeSignature "$env:ASSET"
          if ($signature.Status -ne "Valid" -or $null -eq $signature.SignerCertificate) {
            throw "Publication refusée : signature Authenticode absente ou invalide."
          }
          $actualPin = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData)).ToLowerInvariant()
          if ($actualPin -cne $pin) {
            throw "Publication refusée : certificat éditeur inattendu."
          }
          $hash = (Get-FileHash "$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path "$env:ASSET" -Leaf)" | Set-Content -Encoding ascii "$env:ASSET.sha256"
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Publication refusée : cette version existe déjà." }
          node scripts/assert-release-boundary.mjs --assert-desktop
          if ($LASTEXITCODE -ne 0) { throw "Publication refusée : contrat de sécurité non satisfait." }
          gh release create "$env:TAG" "$env:ASSET" "$env:ASSET.sha256" "desktop-dist/QUANTIC_RELEASE_AUDIT.json" --target "$env:GITHUB_SHA" --title "QuanticMail Desktop $env:VERSION" --notes "Client Web historique signé ; ne constitue pas la version native PQ."
          if ($LASTEXITCODE -ne 0) { throw "Publication échouée." }
