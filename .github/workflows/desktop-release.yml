name: QuanticMail Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Resolve desktop version
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" | ConvertFrom-Json
          "VERSION=$($pkg.version)" >> $env:GITHUB_ENV
          "TAG=quanticmail-desktop-v$($pkg.version)" >> $env:GITHUB_ENV
          "ASSET=desktop-dist/QuanticMail-Setup-$($pkg.version).exe" >> $env:GITHUB_ENV
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --target "$env:GITHUB_SHA" --title "QuanticMail Desktop $env:VERSION" --notes "Application Windows officielle QuanticMail. Le client ouvre QuanticMail dans une fenêtre dédiée et conserve la session locale du poste."
          }
          gh release upload "$env:TAG" "$env:ASSET" --clobber
