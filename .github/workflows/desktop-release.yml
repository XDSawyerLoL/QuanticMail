name: Retired Electron Web client - release refused

on:
  workflow_dispatch:

permissions:
  contents: read

# Intentionally no release job or write permission. Historical Web account
# data is preserved, but the Electron website wrapper is no longer shipped.
# Native Alpha packaging stays in native-vault-lab.yml; publisher signing is
# a separate reviewed operation, never synthesized by this workflow.
jobs:
  refuse-obsolete-web-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fail closed - cannot publish retired Web wrapper
        run: node scripts/refuse-legacy-electron-release.mjs
