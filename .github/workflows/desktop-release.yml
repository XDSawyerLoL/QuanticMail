name: QuanticMail Desktop Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Resolve desktop version
        shell: pwsh
        run: |
          $pkg = Get-Content "package.json" | ConvertFrom-Json
          "VERSION=$($pkg.version)" >> $env:GITHUB_ENV
          "TAG=quanticmail-desktop-v$($pkg.version)" >> $env:GITHUB_ENV
          "ASSET=desktop-dist/QuanticMail-Setup-$($pkg.version).exe" >> $env:GITHUB_ENV
      - name: Build Windows installer
        run: npm run desktop:dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((Get-AuthenticodeSignature "$env:ASSET").Status -ne "Valid") {
            throw "Publication refusée : signature Authenticode absente ou invalide."
          }
          $hash = (Get-FileHash "$env:ASSET" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path "$env:ASSET" -Leaf)" | Set-Content -Encoding ascii "$env:ASSET.sha256"
          gh release view "$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Publication refusée : cette version existe déjà."
          }
          gh release create "$env:TAG" "$env:ASSET" "$env:ASSET.sha256" --target "$env:GITHUB_SHA" --title "QuanticMail Desktop $env:VERSION" --notes "Version signée. Vérifier la signature Authenticode de l’installateur."
          if ($LASTEXITCODE -ne 0) { throw "Publication échouée." }
